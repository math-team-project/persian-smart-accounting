<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}داشبورد هوشمند حسابرسی{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { vazir: ["Vazirmatn", "Tahoma", "sans-serif"] },
          colors: {
            brand: {
              50: "#eff6ff", 100: "#dbeafe", 200: "#bfdbfe", 300: "#93c5fd",
              400: "#60a5fa", 500: "#3b82f6", 600: "#2563eb", 700: "#1d4ed8",
              800: "#1e40af", 900: "#1e3a8a"
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/static/css/app.css" />
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-slate-50 font-vazir text-slate-800 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
      <a href="/" class="flex items-center gap-2 text-slate-800">
        <span class="text-brand-600">{{ icon('shield-check', 26) | safe }}</span>
        <span class="text-lg font-semibold">داشبورد هوشمند حسابرسی</span>
      </a>
      <nav class="flex items-center gap-4 text-sm text-slate-500">
        <a href="/checklist" class="hover:text-brand-600">چک‌لیست حسابرسی</a>
        <a href="/audit-summary" class="hover:text-brand-600">خلاصه‌سازی گزارش</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    {% block content %}{% endblock %}
  </main>

  <footer class="mt-12 border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    Persian Smart Accounting &mdash; داشبورد هوشمند حسابرسی و حسابداری
  </footer>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
