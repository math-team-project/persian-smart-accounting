sheet_descriptions:
  eblagh:
    overall_description: "این فایل از نوع ابلاغ بودجه مصوب است و به‌طور کلی شامل متن ابلاغیه، خلاصه بودجه دستگاه، درآمدها و واگذاری دارایی‌های مالی و سرمایه‌ای، اعتبارات هزینه‌ای به تفکیک برنامه/فعالیت، اعتبارات هزینه‌ای بر حسب فصول هزینه، و اعتبار طرح‌های تملک دارایی‌های سرمایه‌ای می‌شود. برای هوش مصنوعی: این فایل تصویر بودجه مصوب یک دستگاه اجرایی را در قالب چند شیت ارائه می‌دهد."
    sheets:
      متن ابلاغیه بودجه مصوب:
        description: "متن ابلاغیه بودجه مصوب؛ شامل شماره ابلاغ، تاریخ، نام دستگاه اجرایی، بندهای تکلیفی و سیاست‌های ابلاغی و امضای مقام مسئول. این شیت معمولاً داده جدولی ندارد و جنبه متنی/حقوقی دارد."
      خلاصه بودجه دستگاه:
        description: "خلاصه بودجه دستگاه؛ شامل جمع کل منابع و مصارف، تفکیک اعتبارات هزینه‌ای و تملک دارایی‌های سرمایه‌ای، عمومی/اختصاصی/متفرقه و شماره طبقه‌بندی دستگاه."
      درآمدها و واگذاری دارایی‌های مالی و سرمایه‌ای:
        description: "درآمدها و واگذاری دارایی‌های مالی و سرمایه‌ای؛ شامل ردیف‌های درآمد عمومی/اختصاصی، کد طبقه‌بندی و جمع درآمدها."
      اعتبارات هزینه‌ای دستگاه اجرایی:
        description: "اعتبارات هزینه‌ای دستگاه به تفکیک برنامه/فعالیت؛ شامل کد برنامه، عنوان برنامه/فعالیت، جمع، هزینه عمومی، اختصاصی و متفرقه."
      اعتبارات هزینه‌ای بر حسب فصول هزینه:
        description: "اعتبارات هزینه‌ای بر حسب فصول هزینه؛ شامل جبران خدمت کارکنان، استفاده از کالاها و خدمات، هزینه‌های اموال و دارایی، یارانه، کمک‌های بلاعوض، رفاه اجتماعی و سایر هزینه‌ها."
      اعتبار طرح‌های تملک دارایی‌های سرمایه‌ای:
        description: "اعتبار طرح‌های تملک دارایی‌های سرمایه‌ای؛ شامل کد طبقه‌بندی، عنوان طرح، سال شروع، سال اتمام و اعتبار ابلاغی."
  taidiyeh:
    overall_description: "این فایل از نوع تاییدیه اعتبارات است و به‌طور کلی شامل تاییدیه اعتبارات هزینه‌ای، اعتبارات اختصاصی و اعتبارات تملک دارایی‌های سرمایه‌ای می‌شود. برای هوش مصنوعی: این سند تصویر تاییدیه رسمی اعتبارات یک دستگاه اجرایی را در قالب یک جدول ارائه می‌دهد."
    pages:
      "تاییدیه اعتبارات هزینه‌ای، اختصاصی و تملک":
        description: "صفحه اصلی شامل جدول تاییدیه اعتبارات است. بخش‌های اصلی: هزینه‌ای (شامل هزینه عمومی، اختصاصی، متفرقه، اعتبارات هزینه‌ای نقدی، اوراق مشارکت و سایر اوراق مالی اسلامی)، تملک دارایی‌های سرمایه‌ای (شامل طرح‌های پیوست ۱، تملک دارایی‌های سرمایه‌ای ملی، استانی، متفرقه و اوراق مشارکت)، تملک دارایی‌های مالی (شامل جمع اعتبارات مالی نقدی و اوراق مشارکت)، هزینه‌های عمومی به تفکیک دستگاه‌های اجرایی و اعتبارات از محل درآمد اختصاصی. ارقام و ستون‌ها شامل تخصیص، عملکرد تملک، بیمه سلامت، بازنشستگی، سایر دولت، برآورد منابع عمومی، برآورد منابع اختصاصی و مانده تخصیص‌یافته است."
  financial_statements:
    overall_description: >
      این فایل شامل مجموعه‌ای از صورت‌های مالی، یادداشت‌های توضیحی همراه، صورتحساب‌های عملکرد بودجه، جداول دارایی‌های ثابت، و سایر جداول مرتبط با گزارشگری مالی و بودجه‌ای یک دستگاه اجرایی است. برای هوش مصنوعی: این فایل تصویر جامعی از وضعیت مالی، عملکرد بودجه، و یادداشت‌های تفصیلی ارائه می‌دهد.
    tables:
      فهرست صورتهاي مالي:
        description: "فهرست عناوین صورت‌های مالی و یادداشت‌های توضیحی همراه، شامل شماره صفحه هر بخش."
      صورت وضعیت مالی:
        description: "صورت وضعیت مالی (ترازنامه) شامل دارایی‌ها، بدهی‌ها و ارزش خالص در تاریخ مشخص، به تفکیک جاری و غیرجاری."
      صورت تغییرات در وضعیت مالی:
        description: "صورت تغییرات در وضعیت مالی شامل درآمدها، هزینه‌ها، خالص تغییر در وضعیت مالی، و گردش حساب تغییرات در ارزش خالص."
      صورت مقایسه بودجه و عملکرد:
        description: "صورت مقایسه بودجه و عملکرد شامل منابع و مصارف، بودجه اولیه/نهایی، عملکرد قابل مقایسه، و تفاوت بودجه نهایی و عملکرد."
      یادداشتهاي توضيحي همراه صورتهاي مالي:
        description: >
          مجموعه یادداشت‌های توضیحی همراه صورت‌های مالی شامل جزئیات اقلام مندرج در صورت‌های مالی،
          مانند موجودی نقد، حساب‌های دریافتنی و پرداختنی، دارایی‌های ثابت، سرمایه‌گذاری‌ها،
          درآمدها و هزینه‌ها، ذخایر، و سایر اطلاعات تکمیلی. این بخش شامل جداول متعدد و ریز اقلام است.
      صورتحساب عملکرد اعتبارات مصوب:
        description: "صورتحساب عملکرد اعتبارات مصوب بودجه (هزینه‌ای، تملک دارایی‌های سرمایه‌ای، اختصاصی) شامل اعتبار ابلاغی، اصلاحیه، مصوب، تخصیص یافته، دریافتی، مصرفی و مانده مصرف نشده."
      صورتحساب عملکرد اعتبارات ابلاغی:
        description: "صورتحساب عملکرد اعتبارات ابلاغی (هزینه‌ای و تملک دارایی‌های سرمایه‌ای) شامل تخصیص یافته، دریافتی از خزانه، مصرفی و مانده مصرف نشده."
      صورتحساب وضعیت وجوه مصرف نشده:
        description: "صورتحساب وضعیت وجوه مصرف نشده سنوات قبل اعتبارات (هزینه‌ای، اختصاصی، تملک دارایی‌های سرمایه‌ای) شامل انتقال از سال قبل، تعدیل، واریز نقدی، مصرفی و مانده پایان سال."
      صورتحساب وضعیت سایر منابع:
        description: "صورتحساب وضعیت سایر منابع (هزینه‌ای) شامل دریافتی‌ها، پرداختی‌ها، و مانده پایان سال."
      جدول داراییهای ثابت مشهود:
        description: "جدول بهای تمام شده و استهلاک انباشته دارایی‌های ثابت مشهود شامل زمین، ساختمان، اثاثیه، ماشین‌آلات، وسایل نقلیه و دارایی در جریان تکمیل."
      جدول داراییهای نامشهود:
        description: "جدول بهای تمام شده و استهلاک انباشته دارایی‌های ثابت نامشهود شامل نرم‌افزارها، حق‌الامتیازها و دارایی نامشهود در جریان تکمیل."
      جدول حمایتهای مالی از واحدهای فناور:
        description: "جدول حمایت مالی مستقیم از واحدهای فناور به تفکیک دوره پیش‌رشد، رشد و فناور، شامل مبالغ پرداختی به هر واحد."
      جدول تعدیلات:
        description: "جدول تعدیلات سنواتی شامل مانده قبل از تعدیلات، تعدیلات بدهکار/بستانکار و مانده پس از تعدیلات برای اقلام مختلف."
      جدول مانده پرداختهای غیرقطعی:
        description: "جدول مانده پرداخت‌های غیرقطعی سنواتی و سال جاری اعتبارات (هزینه‌ای، اختصاصی، تملک دارایی‌های سرمایه‌ای و سایر منابع) به تفکیک نام گیرنده، موضوع و مبلغ."
      جدول درآمدهای اختصاصی:
        description: "جدول مقایسه پیش‌بینی و وصولی درآمد اختصاصی، و مقایسه وصولی سال جاری و سال قبل به تفکیک ردیف‌های درآمدی."
      جدول عوامل هزینه:
        description: "جدول نگاشت کدهای هزینه به عناوین و طبقات هزینه‌ای، همراه با مبالغ مانده بدهکار و جمع بر اساس گروه‌های هزینه."
      ثبتهای حسابداری:
        description: "فهرست یادآوری ثبت‌های حسابداری مورد نیاز برای بستن حساب‌ها، ثبت دارایی‌ها، ذخایر و سایر موارد." 
  budget:
    overall_description: |
      این فایل شامل اصلاحیه بودجه تفصیلی یک دستگاه اجرایی است که در قالب چند فرم ارائه شده است. این فرم‌ها شامل خلاصه بودجه، اعتبارات هزینه‌ای و تملک دارایی‌های سرمایه‌ای به تفکیک برنامه و فعالیت، شرح اهداف و وظایف، جزئیات طرح‌ها، آمار نیروی انسانی، و اعتبارات از منابع دیگر می‌شود.
    pages:
      "فرم ۱ - خلاصه اصلاحیه بودجه تفصیلی":
        description: |
          این فرم خلاصه‌ای از اصلاحیه بودجه تفصیلی را ارائه می‌دهد. شامل جمع کل اعتبارات هزینه‌ای و تملک دارایی‌های سرمایه‌ای، به تفکیک منابع عمومی، اختصاصی و متفرقه. ستون‌ها شامل اعتبار سال قبل، تخصیص، عملکرد، اعتبار مصوب، اصلاحیه، انتقالی از مانده و اعتبار نهایی است.
      "فرم ۲ - اعتبارات هزینه‌ای و تملک دارایی‌های سرمایه‌ای به تفکیک برنامه":
        description: |
          این فرم اعتبارات را به تفکیک برنامه‌ها و فعالیت‌ها نشان می‌دهد. شامل ردیف‌های هزینه‌ای و تملک دارایی‌های سرمایه‌ای، با تفکیک منبع عمومی و اختصاصی، و ستون‌های اعتبار مصوب، اصلاحیه، افزایش، جمع، عملکرد سال قبل، و جمع کل اعتبارات.
      "فرم ۳ - اهداف، وظایف و سیاست‌های اجرایی":
        description: |
          این فرم شامل توضیحات متنی درباره اهداف کمی و کیفی، وظایف دستگاه، سیاست‌های اجرایی و اقدامات مهم در رابطه با اعتبارات هزینه‌ای و تملک دارایی‌های سرمایه‌ای است. همچنین شامل توضیحاتی درباره امکانات و ساختمان‌های دستگاه می‌باشد.
      "فرم ۴ - مشخصات طرح‌ها و پروژه‌های تملک دارایی‌های سرمایه‌ای":
        description: |
          این فرم جزئیات طرح‌های تملک دارایی‌های سرمایه‌ای را ارائه می‌دهد. شامل عنوان طرح، شماره طبقه‌بندی، حجم عملیات، هزینه واحد، درصد پیشرفت، سال شروع و خاتمه، و اعتبارات از منابع مختلف (عمومی، اختصاصی، متفرقه) است.
      "فرم ۵ - اعتبارات هزینه‌ای به تفکیک برنامه و فعالیت":
        description: |
          این فرم ریز اعتبارات هزینه‌ای را به تفکیک برنامه‌ها و فعالیت‌ها نشان می‌دهد. شامل ردیف‌های مختلف هزینه‌ای مانند حقوق و مزایا، خدمات، ملزومات، و غیره، با ستون‌های اعتبار مصوب، عملکرد، تخصیص، و اعتبار نهایی.
      "فرم ۶ - آمار نیروی انسانی":
        description: |
          این فرم آمار نیروی انسانی دستگاه را بر اساس مدرک تحصیلی و نوع استخدام (رسمی، پیمانی، قراردادی) ارائه می‌دهد. شامل تعداد نیرو در سال‌های مختلف و تغییرات (افزایش/کاهش) است.
      "فرم ۷ - اعتبارات از منابع دیگر":
        description: |
          این فرم اعتبارات تأمین‌شده از منابع دیگر (غیر از بودجه عمومی) را برای برنامه‌های مختلف نشان می‌دهد. شامل ستون‌های مانده اعتبار سنوات قبل، اعتبار تخصیص یافته، عملکرد، مانده مصرف نشده، و اعتبار ابلاغ شده سال جاری است.
      "فرم ۸ - اعتبارات تملک دارایی‌های سرمایه‌ای از منابع دیگر":
        description: |
          این فرم اعتبارات طرح‌های تملک دارایی‌های سرمایه‌ای را که از منابع دیگر تأمین می‌شوند، نشان می‌دهد. شامل عنوان برنامه، شماره برنامه، مانده اعتبار سنوات قبل، اعتبار تخصیص یافته، عملکرد، و مانده مصرف نشده است.
  taraz:
    overall_description: >
      این فایل از نوع تراز حساب‌ها است و به‌طور کلی شامل دو جدول تراز در سطوح مختلف است:
      تراز کل و تراز معین. این جداول مانده حساب‌ها را به تفکیک کد و نام حساب، جمع بدهکار و بستانکار،
      و مانده بدهکار یا بستانکار نشان می‌دهند. برای هوش مصنوعی: این فایل تصویر جامعی از گردش و مانده
      حساب‌های اصلی و معین یک دستگاه اجرایی را ارائه می‌دهد و برای کنترل جمع‌ها، تطبیق با صورت‌های مالی،
      و تحلیل اقلام دارایی، بدهی، درآمد، هزینه، حساب‌های انتظامی و اعتبارات بودجه‌ای کاربرد دارد.
    tables:
      تراز کل:
        description: >
          جدول تراز در سطح کل حساب‌ها؛ شامل کد حساب، نام حساب، جمع بدهکار، جمع بستانکار،
          مانده بدهکار و مانده بستانکار. این جدول سطوح اصلی حساب‌ها مانند موجودی نقد،
          حساب‌های دریافتنی و پرداختنی، دارایی‌های ثابت مشهود و نامشهود، سرمایه‌گذاری بلندمدت،
          بدهی‌ها، ذخایر، ارزش خالص انباشته، درآمدها، هزینه‌ها، وجوه ارسالی به خزانه،
          حساب‌های انتظامی، و حساب‌های بودجه و اعتبارات را پوشش می‌دهد.
      تراز معین:
        description: >
          جدول تراز در سطح معین حساب‌ها؛ شامل کد معین، نام معین، جمع بدهکار، جمع بستانکار،
          مانده بدهکار و مانده بستانکار. این جدول ریزتر از تراز کل است و اقلامی مانند بانک‌ها،
          تنخواه‌گردان، حساب‌ها و اسناد دریافتنی، پیش‌پرداخت‌ها، دارایی‌های ثابت به تفکیک نوع،
          استهلاک انباشته، سرمایه‌گذاری‌ها، بدهی‌های جاری و غیرجاری، ذخایر، درآمدهای اختصاصی و عمومی،
          هزینه‌های فصلی، وجوه ارسالی، و حساب‌های انتظامی و بودجه‌ای را به‌صورت تفصیلی‌تر نشان می‌دهد.        
  daramad:
    overall_description: >
      این فایل از نوع افزایش سقف درآمد اختصاصی است و به‌طور کلی شامل نامه ابلاغ افزایش سقف درآمد اختصاصی،
      شماره و تاریخ پیوست، مرجع تصویب، مبلغ افزایش‌یافته و برنامه مربوطه می‌شود.
      برای هوش مصنوعی: این سند تصویر نامه رسمی افزایش سقف درآمد اختصاصی یک دستگاه اجرایی را ارائه می‌دهد.
    pages:
      "نامه افزایش سقف درآمد اختصاصی":
        description: >
          نامه اداری شامل سربرگ، شماره و تاریخ پیوست، مخاطب، متن ابلاغ افزایش سقف درآمد اختصاصی
          بر اساس موافقتنامه و تأییدیه، مبلغ تعیین‌شده و برنامه مربوطه، نام و سمت امضاکننده،
          و در صورت وجود روئوشت و اطلاعات تماس سازمان مربوطه.